# Canonical CI — this is the gate on what actually lands.
#
# The public mirror runs the SAME suite under GitHub Actions
# (.github/workflows/ci.yml), because that mirror is the only signal an external
# contributor can ever get: this forge is not reachable from the internet. That
# duplication is deliberate and it is cheap — the suite needs nothing installed.
#
# Keep the two in step. If a check is added here and not there, a contributor's
# green pull request stops predicting the upstream result, which is worse than
# having no check at all.
#
# Deliberately built on PUBLIC python images rather than an internal CI image:
# this repository is meant to stand on its own, and tying its gate to another
# project's image lifecycle is exactly the coupling the extraction removed.

when:
  - event: [push, pull_request]

clone:
  git:
    image: codefloe.com/crow-plugins/clone
    settings:
      skip-verify: true

steps:
  # The forge's merge button authors the merge commit as whoever clicked it, so a
  # single convenient click puts a personal identity into the public history of a
  # public repository. It has happened twice, and both times the only remedy was
  # rewriting published history. CONTRIBUTING.md documents merging locally
  # instead; this is what makes forgetting that visible immediately rather than
  # months later.
  #
  # MERGE COMMITS ONLY. Contributor commits keep their own Author, which is the
  # promise CONTRIBUTING.md makes to anyone who sends a pull request — checking
  # every commit here would turn that promise into a CI failure.
  - name: merge-commit-authorship
    image: docker.io/alpine/git:latest
    commands:
      - |
        set -eu
        # Fail closed on a shallow clone: `git log` over a truncated history
        # would find no merges and pass while checking nothing.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --unshallow --quiet || {
            echo "shallow clone and could not deepen it — this check would pass vacuously"
            exit 1
          }
        fi
        bad="$(git log --merges --format='%h %an <%ae>' | grep -v '<caderuntime@cade.run>$' || true)"
        if [ -n "$bad" ]; then
          echo "merge commits not authored by the project identity:"
          echo "$bad"
          echo
          echo "The forge's merge button authors as the account that clicked it."
          echo "Merge locally instead — see 'Merging an upstream pull request' in"
          echo "CONTRIBUTING.md. Fixing this after the fact means rewriting"
          echo "published history, so do it before the next merge, not after."
          exit 1
        fi
        echo "all $(git log --merges --oneline | wc -l) merge commits are caderuntime@cade.run"

  - name: lint
    image: docker.io/python:3.11-slim
    commands:
      # Pinned, so somebody else's linter release cannot turn a green branch red.
      - pip install --quiet ruff==0.14.2 mypy==1.18.2
      - ruff check .
      - mypy --config-file pyproject.toml

  # The Python versions BLENDER bundles — 3.11 ships with the declared 4.2 floor,
  # 3.13 with 5.2 LTS. Testing "latest Python" would be testing an interpreter
  # the addon never runs on.
  #
  # Take these from upstream's build_files/build_environment/cmake/versions.cmake
  # at the release tag (v4.2.0 → PYTHON_VERSION 3.11.7; v5.2.0 → 3.13.13). Do NOT
  # ask a locally installed Blender: distro packages routinely link the SYSTEM
  # interpreter instead of bundling one, so it answers for the distro, not for
  # Blender. That mistake once put 3.14 here and left 3.13 — the version that
  # actually ships — untested.
  - name: test-py311
    image: docker.io/python:3.11-slim
    commands:
      - python3 -m compileall -q .
      - PYTHONPATH=. python3 -m unittest discover -s test -t test -v

  - name: test-py313
    image: docker.io/python:3.13-slim
    commands:
      - python3 -m compileall -q .
      - PYTHONPATH=. python3 -m unittest discover -s test -t test -v

  - name: package
    image: docker.io/python:3.11-slim
    commands:
      # The zip is the only artifact a user ever receives, so "the tests pass" is
      # not the same as "this is installable".
      - python3 package.py build
      - ls -l dist/

      # And the listing that ADVERTISES the zip — on every change, not only when a
      # tag is cut. The release workflow is the one path in this repository that
      # cannot be exercised before it runs for real, so prove at least that the
      # generator it calls still reads a freshly built zip and writes a document.
      # The URL is a stand-in: the real one names a Release that does not exist yet.
      - >
        python3 index.py
        --zip "$(ls dist/*.zip)"
        --archive-url https://github.com/caderuntime/blender-bridge/releases/download/v0.0.0/placeholder.zip
        --out site/index.json
      - cat site/index.json
