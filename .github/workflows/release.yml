# Release — build the extension zip and publish it as a GitHub Release.
#
# THIS HALF RUNS HERE BECAUSE IT CANNOT RUN ANYWHERE ELSE. A GitHub Release is not
# a git object, so a push mirror cannot carry one: the canonical upstream
# (unreachable from the internet, see CONTRIBUTING.md) can only push refs and tags.
# The tag is what crosses, and this is what it triggers.
#
#   upstream `git tag v0.1.0` → mirror → this workflow → zip → Release
#                            → upstream .crow/release.yaml → index.json → Pages
#
# That inversion buys something real rather than merely working around a
# limitation: the artifact users install is built by PUBLIC CI from PUBLIC source,
# which is the property a reproducible extension zip is trying to have in the
# first place. `package.py` writes byte-identical zips from identical trees — and
# upstream now CHECKS that, by rebuilding this zip and refusing to advertise a
# published artifact whose bytes it cannot reproduce.
#
# WHAT A USER ACTUALLY CONSUMES is not this Release — it is
# https://extensions.cade.run/index.json, a Blender 4.2+ extension repository they
# paste into Blender once and which is then re-read forever for updates.
#
# THAT INDEX IS DEPLOYED FROM UPSTREAM, NOT FROM HERE, and this workflow
# deliberately holds no Cloudflare credential. Publishing to Cloudflare Pages needs
# an API token, and Cloudflare tokens CANNOT be scoped to a single Pages project —
# Pages permissions are account-wide — so the smallest token able to deploy one
# JSON file can also redeploy every other Pages project on the account, including
# the one fronting show.cade.run. Storing that in a PUBLIC repository buys nothing
# and risks everything, so `.crow/release.yaml` upstream waits for the Release this
# job publishes, fetches the asset, and deploys the index from inside the lab.
#
# WHICH MEANS THE ORDER IS INVERTED FROM THE OBVIOUS ONE, on purpose: this job
# publishes the Release WITHOUT anything advertising it yet, and the index appears
# minutes later. An index naming an asset that does not exist fails on every user's
# machine; a Release nobody has been told about is merely quiet.

name: Release

on:
  push:
    tags: ["v*"]

  # ESCAPE HATCH for the last unproven link in the chain: whether a ref that
  # arrives by MIRROR raises the event this workflow listens for.
  #
  # HALF OF THAT IS NOW ANSWERED, and the answer is yes. On 2026-07-30 a mirror
  # sync pushed main here at 14:25:55Z and GitHub Actions ran the CI workflow on
  # it three seconds later (event `push`, head bb3ce58, success). A mirrored push
  # is an ordinary push as far as Actions is concerned, so there is no reason a
  # mirrored TAG should behave differently — but that specific case stays untested
  # until the first release, which is why this input remains.
  #
  # If it does not fire, run this by hand with the tag name rather than
  # hand-uploading a zip: the point is that the published artifact always comes
  # from this job, built by public CI from public source.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write # create the Release and upload the zip to it

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Spelled out rather than reusing `env.TAG`: a tag push checks out the
          # tag, and a manual run checks out the tag it was given — never the
          # branch tip, which would build a tree the tag does not name.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          # The addon's declared floor, and the interpreter Blender 4.2 bundles.
          # Building the shipped zip on it means the artifact cannot depend on
          # anything newer than the oldest Blender it claims to support.
          python-version: "3.11"

      # ── Pre-flight: refuse to publish a release we cannot finish ──────────
      #
      # Every check here fails BEFORE the Release exists, because a half-published
      # release cannot be rolled back — deleting a Release and re-tagging is
      # visible to anyone who fetched in between, and a stale index is invisible.

      - name: The tag must match the manifest version
        run: |
          set -eu
          manifest_version="$(python3 -c 'import package; print(package.read_manifest()["version"])')"
          tag_version="${TAG#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::tag $TAG says version '$tag_version', but"
            echo "::error::showcade_bridge/blender_manifest.toml says '$manifest_version'."
            echo "::error::The zip is named from the MANIFEST, so publishing this would attach"
            echo "::error::showcade_bridge-$manifest_version.zip to a release called $TAG, and"
            echo "::error::Blender would offer version '$manifest_version' to anyone who added"
            echo "::error::the repository. Fix the manifest (and bl_info, which test_packaging"
            echo "::error::keeps in step) and re-tag."
            exit 1
          fi
          echo "version $manifest_version"

      - name: The CHANGELOG must have a section for this version
        run: |
          set -eu
          python3 - "${TAG#v}" <<'PY'
          import pathlib
          import sys

          version = sys.argv[1]
          wanted = f"## {version}"
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          try:
              start = next(i for i, line in enumerate(lines) if line.strip() == wanted)
          except StopIteration:
              print(f"::error::CHANGELOG.md has no '{wanted}' section.")
              print("::error::A release with no note about what changed is one nobody can")
              print("::error::decide whether to install. Add the section and re-tag.")
              raise SystemExit(1) from None

          end = next(
              (i for i, line in enumerate(lines[start + 1 :], start + 1) if line.startswith("## ")),
              len(lines),
          )
          body = "\n".join(lines[start + 1 : end]).strip()
          if not body:
              print(f"::error::CHANGELOG.md's '{wanted}' section is empty.")
              raise SystemExit(1)
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"release notes: {len(body.splitlines())} lines")
          PY

      # ── Build and prove ──────────────────────────────────────────────────

      # The full suite, again, on the exact tree being published. CI already ran
      # it on the commit, but a tag is a claim about an ARTIFACT, and re-running
      # here is what makes "this zip passed its tests" true of the bytes users get
      # rather than of a commit that shares their history.
      - name: Tests
        run: |
          python3 -m compileall -q .
          PYTHONPATH=. python3 -m unittest discover -s test -t test

      - name: Build the extension zip
        run: |
          set -eu
          python3 package.py build
          zip_path="$(ls dist/*.zip)"
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          ls -l dist/
          # The zip's NAME is deliberately not exported any more. It existed to
          # compose the index's archive_url; upstream derives that itself from the
          # tag and the manifest, and the asset URL GitHub serves for a Release
          # upload is deterministic — /releases/download/<tag>/<filename>.

      # ── Publish ──────────────────────────────────────────────────────────

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a Release for $TAG already exists."
            echo "::error::Re-publishing would replace the asset users may already have"
            echo "::error::installed, under a version number that no longer means one thing."
            echo "::error::Cut a new version instead."
            exit 1
          fi
          gh release create "$TAG" "$ZIP_PATH" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag

      - uses: actions/upload-artifact@v4
        with:
          name: showcade_bridge-${{ inputs.tag || github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error
