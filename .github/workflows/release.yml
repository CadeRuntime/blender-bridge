# Release — build the zip, publish it, and refresh the extension repository index.
#
# THIS WORKFLOW IS THE PUBLISHER, and it runs HERE rather than upstream on purpose.
# A GitHub Release is not a git object, so a push mirror cannot carry one: the
# canonical upstream (unreachable from the internet, see CONTRIBUTING.md) can only
# ever push refs and tags. The tag is what crosses, and this is what it triggers.
#
#   upstream `git tag v0.1.0` → mirror → this workflow → zip → Release → index.json
#
# That inversion buys something real rather than merely working around a
# limitation: the artifact users install is built by PUBLIC CI from PUBLIC source,
# which is the property a reproducible extension zip is trying to have in the
# first place. `package.py` writes byte-identical zips from identical trees, so
# anyone can rebuild the release and compare.
#
# WHAT A USER ACTUALLY CONSUMES is not this Release — it is
# https://extensions.cade.run/index.json, a Blender 4.2+ extension repository.
# They paste that URL into Blender ▸ Preferences ▸ Get Extensions ▸ Repositories
# once, and Blender re-reads it forever for updates. The zips stay in GitHub
# Releases; only the index is served from Cloudflare Pages (bd showcade-8i87.11),
# which is why `index.py` must be handed an ABSOLUTE archive URL.
#
# ORDER IS LOAD-BEARING. Pre-flight everything, then publish the Release, then the
# index that points at it. An index advertising a Release asset that does not
# exist is a repository that fails on every user's machine; a Release nobody is
# told about is merely quiet. So the deploy credentials are checked BEFORE
# anything is published, and the index is written only once the asset URL is real.

name: Release

on:
  push:
    tags: ["v*"]

  # ESCAPE HATCH, and it exists because of a genuine unknown: a tag that arrives
  # by MIRROR is an ordinary push and should trigger the `push` event above, but
  # mirror semantics are the one part of this path that cannot be tested until the
  # first real tag crosses. If it turns out not to fire, run this by hand with the
  # tag name instead of hand-uploading a zip — the point is that the published
  # artifact always comes from this job.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write # create the Release and upload the zip to it

env:
  TAG: ${{ inputs.tag || github.ref_name }}

  # The Cloudflare Pages project serving extensions.cade.run (bd showcade-8i87.11).
  # `--branch` must name that project's PRODUCTION branch: a deploy on any other
  # branch is published as a PREVIEW under its own alias, so it would succeed,
  # print a URL, and leave the custom domain still serving the previous index.
  PAGES_PROJECT: blender-bridge
  PAGES_BRANCH: main

  # Pinned deliberately. `wrangler@latest` would let somebody else's release
  # change the behaviour of a publish that only runs when we cut a version — the
  # worst possible time to discover a CLI change. Same pin as showcade's CI image.
  WRANGLER_VERSION: 4.112.0

jobs:
  release:
    name: publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Spelled out rather than reusing `env.TAG`: a tag push checks out the
          # tag, and a manual run checks out the tag it was given — never the
          # branch tip, which would build a tree the tag does not name.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          # The addon's declared floor, and the interpreter Blender 4.2 bundles.
          # Building the shipped zip on it means the artifact cannot depend on
          # anything newer than the oldest Blender it claims to support.
          python-version: "3.11"

      # ── Pre-flight: refuse to publish a release we cannot finish ──────────
      #
      # Every check here fails BEFORE the Release exists, because a half-published
      # release cannot be rolled back — deleting a Release and re-tagging is
      # visible to anyone who fetched in between, and a stale index is invisible.

      - name: The tag must match the manifest version
        run: |
          set -eu
          manifest_version="$(python3 -c 'import package; print(package.read_manifest()["version"])')"
          tag_version="${TAG#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::tag $TAG says version '$tag_version', but"
            echo "::error::showcade_bridge/blender_manifest.toml says '$manifest_version'."
            echo "::error::The zip is named from the MANIFEST, so publishing this would attach"
            echo "::error::showcade_bridge-$manifest_version.zip to a release called $TAG, and"
            echo "::error::Blender would offer version '$manifest_version' to anyone who added"
            echo "::error::the repository. Fix the manifest (and bl_info, which test_packaging"
            echo "::error::keeps in step) and re-tag."
            exit 1
          fi
          echo "version $manifest_version"

      - name: The CHANGELOG must have a section for this version
        run: |
          set -eu
          python3 - "${TAG#v}" <<'PY'
          import pathlib
          import sys

          version = sys.argv[1]
          wanted = f"## {version}"
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          try:
              start = next(i for i, line in enumerate(lines) if line.strip() == wanted)
          except StopIteration:
              print(f"::error::CHANGELOG.md has no '{wanted}' section.")
              print("::error::A release with no note about what changed is one nobody can")
              print("::error::decide whether to install. Add the section and re-tag.")
              raise SystemExit(1) from None

          end = next(
              (i for i, line in enumerate(lines[start + 1 :], start + 1) if line.startswith("## ")),
              len(lines),
          )
          body = "\n".join(lines[start + 1 : end]).strip()
          if not body:
              print(f"::error::CHANGELOG.md's '{wanted}' section is empty.")
              raise SystemExit(1)
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"release notes: {len(body.splitlines())} lines")
          PY

      - name: The publish credentials must be present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing"
            echo "::error::Without them the Release would publish and the extension repository"
            echo "::error::index would keep advertising the PREVIOUS version — an update nobody"
            echo "::error::is offered. Failing before anything is published instead."
            echo "::error::The token is scoped to Pages:Edit on the '$PAGES_PROJECT' project"
            echo "::error::only; see bd showcade-8i87.11."
            exit 1
          fi

      - name: The Pages project must already exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          # WHY THIS CHECK EXISTS: `wrangler pages deploy` offered a
          # not-a-terminal prompt to CREATE a missing project answers itself YES.
          # It would invent a project — with its own *.pages.dev name and no custom
          # domain — publish there, and exit 0. The index would be live at an
          # address nobody has, while extensions.cade.run served the old one. So
          # look first, and say what to do rather than guessing.
          # Delimited match, not `grep -w`: `-w` treats `-` as a word boundary, so
          # it would happily accept a project called `blender-bridge-old`.
          if ! npx --yes "wrangler@$WRANGLER_VERSION" pages project list 2>/dev/null \
              | grep -qE "(^|[[:space:]|])${PAGES_PROJECT}([[:space:]|]|\$)"; then
            echo "::error::no Cloudflare Pages project named '$PAGES_PROJECT' on this account."
            echo "::error::Create it (and attach extensions.cade.run to it) before tagging a"
            echo "::error::release — bd showcade-8i87.11 owns that setup. Nothing has been"
            echo "::error::published by this run."
            exit 1
          fi

      # ── Build and prove ──────────────────────────────────────────────────

      # The full suite, again, on the exact tree being published. CI already ran
      # it on the commit, but a tag is a claim about an ARTIFACT, and re-running
      # here is what makes "this zip passed its tests" true of the bytes users get
      # rather than of a commit that shares their history.
      - name: Tests
        run: |
          python3 -m compileall -q .
          PYTHONPATH=. python3 -m unittest discover -s test -t test

      - name: Build the extension zip
        run: |
          set -eu
          python3 package.py build
          zip_path="$(ls dist/*.zip)"
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$(basename "$zip_path")" >> "$GITHUB_ENV"
          ls -l dist/

      # ── Publish ──────────────────────────────────────────────────────────

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a Release for $TAG already exists."
            echo "::error::Re-publishing would replace the asset users may already have"
            echo "::error::installed, under a version number that no longer means one thing."
            echo "::error::Cut a new version instead."
            exit 1
          fi
          gh release create "$TAG" "$ZIP_PATH" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Write the extension repository index
        run: |
          set -eu
          # The asset URL GitHub serves for a Release upload is deterministic —
          # /releases/download/<tag>/<filename> — which is what lets the index be
          # written from the tag and the zip name without querying the API.
          python3 index.py \
            --zip "$ZIP_PATH" \
            --archive-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}" \
            --out site/index.json
          cat site/index.json

      - name: Deploy the index to extensions.cade.run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          # DIRECT UPLOAD, not a branch build: the site is one generated file that
          # exists nowhere in git, and this repository is a mirror whose pushes may
          # not raise the events a Pages build watches.
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy site \
            --project-name="$PAGES_PROJECT" \
            --branch="$PAGES_BRANCH"

      - name: Verify the published index describes this release
        run: |
          set -eu
          # END-TO-END, from the address users actually paste in. Pages purges its
          # edge on deploy, so a stale answer here is a real failure rather than a
          # caching artefact — and it is the only check that covers the custom
          # domain, the TLS certificate and the bot-fight rules at once.
          #
          # If this fails while everything above passed, the Release is fine and
          # only the index is behind: re-run this job, or `wrangler pages deploy`
          # by hand. Nothing needs re-tagging.
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 30 https://extensions.cade.run/index.json > published.json; then
              break
            fi
            echo "attempt $attempt: index not served yet; waiting"
            sleep 10
          done
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          published = json.loads(pathlib.Path("published.json").read_text())
          expected = json.loads(pathlib.Path("site/index.json").read_text())
          if published != expected:
              print("::error::https://extensions.cade.run/index.json is not what this job wrote.")
              print(f"::error::published: {json.dumps(published)[:400]}")
              sys.exit(1)
          entry = published["data"][0]
          print(f"published {entry['id']} {entry['version']} → {entry['archive_url']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: showcade_bridge-${{ inputs.tag || github.ref_name }}
          path: |
            dist/*.zip
            site/index.json
          if-no-files-found: error
