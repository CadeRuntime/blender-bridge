# CI for external contributors.
#
# This repository is a MIRROR of a canonical upstream that is not reachable from
# GitHub, so the CI that gates what actually lands runs there and you cannot see
# it. That is exactly why this file exists: without it a contributor's pull
# request would get no signal at all, and we would be asking strangers to trust a
# green check they cannot run. See CONTRIBUTING.md.
#
# The two run the same suite, so a green result here is a real prediction of the
# upstream result rather than a weaker parallel check.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The forge's merge button authors the merge commit as whoever clicked it, so a
  # single convenient click puts a personal identity into the public history of a
  # public repository. It has happened twice, and both times the only remedy was
  # rewriting published history. CONTRIBUTING.md documents merging locally
  # instead; this makes forgetting that visible immediately rather than months on.
  #
  # MERGE COMMITS ONLY. Contributor commits keep their own Author, which is the
  # promise CONTRIBUTING.md makes to anyone who sends a pull request — checking
  # every commit would turn that promise into a CI failure.
  merge-commit-authorship:
    name: merge commits are the project identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the default depth-1: this check reads every
          # merge commit, and a shallow clone would find none and pass while
          # checking nothing.
          fetch-depth: 0

      - run: |
          set -eu
          bad="$(git log --merges --format='%h %an <%ae>' | grep -v '<caderuntime@cade.run>$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::merge commits not authored by the project identity:"
            echo "$bad"
            echo "::error::Merge locally instead — see 'Merging an upstream pull request'"
            echo "::error::in CONTRIBUTING.md. Fixing it afterwards means rewriting"
            echo "::error::published history."
            exit 1
          fi
          echo "all $(git log --merges --oneline | wc -l) merge commits are caderuntime@cade.run"

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The addon's declared floor. Linting on it is what stops a rule from
          # proposing syntax the oldest supported Blender cannot parse.
          python-version: "3.11"

      # Pinned, not floating: an unpinned linter turns somebody else's release
      # into a red build on a pull request that changed nothing.
      - run: pip install ruff==0.14.2 mypy==1.18.2

      - run: ruff check .

      # Scoped to the Blender-free modules by pyproject.toml. The UI half
      # annotates properties as `x: bpy.props.StringProperty(...)` — an
      # annotation whose value is a call, which no type checker accepts.
      - run: mypy --config-file pyproject.toml

  test:
    name: unittest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Python versions BLENDER bundles, not "latest": 3.11 is what the
        # declared 4.2 floor ships, 3.13 is what 5.2 LTS ships. Testing anything
        # else would be testing an interpreter the addon never runs on.
        #
        # Source these from upstream's build_files/build_environment/cmake/
        # versions.cmake at the release tag (v4.2.0 → PYTHON_VERSION 3.11.7;
        # v5.2.0 → 3.13.13), never from a locally installed Blender: distro
        # packages routinely link the SYSTEM interpreter rather than bundling
        # one, so they answer for the distro. That is how 3.14 ended up here
        # while 3.13 — the version that actually ships — went untested.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Deliberately NO dependency install step. The addon and its tests are
      # standard library only, and the catalog service is faked in-process, so
      # there is nothing to install. If this step ever becomes necessary,
      # something has taken a dependency that the addon cannot afford — Blender
      # ships no package manager for extensions.
      - name: Syntax gate
        run: python3 -m compileall -q .

      - name: Tests
        run: PYTHONPATH=. python3 -m unittest discover -s test -t test -v

  package:
    name: build the extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The zip is the only artifact a user ever receives, so "the tests pass"
      # is not the same as "this is installable". Build it on every change.
      - run: python3 package.py build

      # And the listing that ADVERTISES the zip — on every change, not only when a
      # tag is cut. release.yml is the one path in this repository that cannot be
      # exercised before it runs for real, so prove at least that the generator it
      # calls still reads a freshly built zip and writes a document. The URL is a
      # stand-in: the real one names a Release that does not exist yet.
      - name: Generate the extension repository index
        run: |
          python3 index.py \
            --zip "$(ls dist/*.zip)" \
            --archive-url https://github.com/caderuntime/blender-bridge/releases/download/v0.0.0/placeholder.zip \
            --out site/index.json
          cat site/index.json

      - uses: actions/upload-artifact@v4
        with:
          name: showcade_bridge-extension
          path: |
            dist/*.zip
            site/index.json
          if-no-files-found: error
